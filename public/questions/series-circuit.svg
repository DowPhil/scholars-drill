<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" font-family="Arial, sans-serif" font-size="14" fill="none" stroke="#111318" stroke-width="2">
  <rect x="0" y="0" width="320" height="180" fill="#ffffff" stroke="none"/>
  <!-- wires -->
  <path d="M40 40 H90 M150 40 H190 M250 40 H280 V140 H40 V100 M40 80 V40"/>
  <!-- resistor 2 ohm -->
  <rect x="90" y="30" width="60" height="20" fill="#ffffff"/>
  <text x="120" y="22" text-anchor="middle" fill="#111318" stroke="none">2 Ω</text>
  <!-- resistor 4 ohm -->
  <rect x="190" y="30" width="60" height="20" fill="#ffffff"/>
  <text x="220" y="22" text-anchor="middle" fill="#111318" stroke="none">4 Ω</text>
  <!-- cell: long plate (+) and short plate (-) -->
  <path d="M24 80 H56" stroke-width="3"/>
  <path d="M31 100 H49" stroke-width="5"/>
  <text x="66" y="96" fill="#111318" stroke="none">12 V</text>
</svg>
